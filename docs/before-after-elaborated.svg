<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" rx="16" fill="#0b1220"/>
<text x="20" y="24" fill="#e8eef7" font-family="sans-serif" font-size="16" font-weight="700">Demand Forecasting ML — Before / After</text>
<rect x="10" y="40" width="940" height="280" rx="14" fill="#0f1a2e" stroke="#d97706" stroke-width="2"/>
<g><title>Before: spreadsheets and gut feel, with no backtest and no way to explain a forecast.</title><rect x="10" y="40" width="940" height="34" rx="14" fill="#d97706"/><text x="24" y="63" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">BEFORE</text></g>
<g><title>Forecasts kept in spreadsheets and gut feel, so they are hard to repeat or check.</title>
<rect x="121" y="103" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="173" cy="127" r="18" fill="#5b6b82"/><text x="173" y="132" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">XL</text>
<text x="173" y="159" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Spreadsheets</text>
</g>
<text x="173" y="183" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">gut feel</text>
<g><title>Historical data dumped by hand, so it is stale before it is used.</title>
<rect x="428" y="103" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="480" cy="127" r="18" fill="#5b6b82"/><text x="480" y="132" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">CSV</text>
<text x="480" y="159" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">CSV dumps</text>
</g>
<text x="480" y="183" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">manual</text>
<g><title>Features built once by hand, so they drift and cannot be reused.</title>
<rect x="734" y="103" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="786" cy="127" r="18" fill="#5b6b82"/><text x="786" y="132" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">FE</text>
<text x="786" y="159" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Manual features</text>
</g>
<text x="786" y="183" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">one-off</text>
<g><title>No held-out backtest, so a model can look good by accidentally using future data.</title>
<rect x="121" y="213" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="173" cy="237" r="18" fill="#5b6b82"/><text x="173" y="242" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">?</text>
<text x="173" y="269" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">No backtest</text>
</g>
<text x="173" y="293" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">leakage risk</text>
<g><title>A model built once with no scoring entry point, so it never reaches the team.</title>
<rect x="428" y="213" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="480" cy="237" r="18" fill="#5b6b82"/><text x="480" y="242" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">M</text>
<text x="480" y="269" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">One-off model</text>
</g>
<text x="480" y="293" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">no scoring</text>
<g><title>No driver summary, so teams cannot tell why a forecast moved.</title>
<rect x="734" y="213" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="786" cy="237" r="18" fill="#5b6b82"/><text x="786" y="242" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">!</text>
<text x="786" y="269" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">No explanation</text>
</g>
<text x="786" y="293" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">black box</text>
<line x1="173" y1="135" x2="480" y2="135" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="480,135 472,131 472,139" fill="#d97706"/>
<line x1="480" y1="135" x2="786" y2="135" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="786,135 778,131 778,139" fill="#d97706"/>
<line x1="786" y1="135" x2="173" y2="245" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="173,245 165,241 165,249" fill="#d97706"/>
<line x1="173" y1="245" x2="480" y2="245" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="480,245 472,241 472,249" fill="#d97706"/>
<line x1="480" y1="245" x2="786" y2="245" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="786,245 778,241 778,249" fill="#d97706"/>
<circle r="6" fill="#ff9900"><animateMotion dur="6s" repeatCount="indefinite" path="M173,135 L480,135 L786,135 L173,245 L480,245 L786,245"/></circle>
<rect x="10" y="340" width="940" height="280" rx="14" fill="#0f1a2e" stroke="#0d9488" stroke-width="2"/>
<g><title>After: transparent features, honest backtesting, and explained 30-day forecasts for planning.</title><rect x="10" y="340" width="940" height="34" rx="14" fill="#0d9488"/><text x="24" y="363" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">AFTER</text></g>
<g><title>Curated lakehouse data as the single source, so forecasts start from trusted history.</title>
<rect x="83" y="403" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="135" cy="427" r="18" fill="#2F81F7"/><text x="135" y="432" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">G</text>
<text x="135" y="459" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Gold lakehouse</text>
</g>
<text x="135" y="483" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">curated data</text>
<g><title>Clean demand history by part and region, the raw material for every forecast.</title>
<rect x="313" y="403" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="365" cy="427" r="18" fill="#0d9488"/><text x="365" y="432" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DH</text>
<text x="365" y="459" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Demand history</text>
</g>
<text x="365" y="483" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">per part, region</text>
<g><title>Lag, rolling means and seasonality built only from past data, so no leakage.</title>
<rect x="543" y="403" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="595" cy="427" r="18" fill="#8C4FFF"/><text x="595" y="432" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">FE</text>
<text x="595" y="459" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Feature engineering</text>
</g>
<text x="595" y="483" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">lag, rolling</text>
<g><title>A transparent baseline and seasonal model, so the method can be explained.</title>
<rect x="773" y="403" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="825" cy="427" r="18" fill="#E25A1C"/><text x="825" y="432" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">TR</text>
<text x="825" y="459" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Train</text>
</g>
<text x="825" y="483" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">baseline + seasonal</text>
<g><title>Last 90 days held out and scored with MAE, so accuracy is measured honestly.</title>
<rect x="83" y="513" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="135" cy="537" r="18" fill="#01A88D"/><text x="135" y="542" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">BT</text>
<text x="135" y="569" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Backtest 90 days</text>
</g>
<text x="135" y="593" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">MAE, no leakage</text>
<g><title>Forecasts for the next 30 days by part and region, ready for planning.</title>
<rect x="313" y="513" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="365" cy="537" r="18" fill="#FF9900"/><text x="365" y="542" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">SC</text>
<text x="365" y="569" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Score next 30 days</text>
</g>
<text x="365" y="593" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">per part, region</text>
<g><title>A plain-English summary of what drove each forecast, so teams can act on it.</title>
<rect x="543" y="513" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="595" cy="537" r="18" fill="#b91c1c"/><text x="595" y="542" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DS</text>
<text x="595" y="569" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Driver summary</text>
</g>
<text x="595" y="593" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">plain English</text>
<g><title>Forecasts delivered to dashboards and planning teams, not left in a notebook.</title>
<rect x="773" y="513" width="104" height="64" rx="10" fill="#1a2a44" stroke="#2a3a55" stroke-width="1.5"/>
<circle cx="825" cy="537" r="18" fill="#5b6b82"/><text x="825" y="542" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">BI</text>
<text x="825" y="569" fill="#e8eef7" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Dashboards</text>
</g>
<text x="825" y="593" fill="#aeb9cc" font-family="sans-serif" font-size="9.5" text-anchor="middle">planning teams</text>
<line x1="135" y1="435" x2="365" y2="435" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="365,435 357,431 357,439" fill="#0d9488"/>
<line x1="365" y1="435" x2="595" y2="435" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="595,435 587,431 587,439" fill="#0d9488"/>
<line x1="595" y1="435" x2="825" y2="435" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="825,435 817,431 817,439" fill="#0d9488"/>
<line x1="825" y1="435" x2="135" y2="545" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="135,545 127,541 127,549" fill="#0d9488"/>
<line x1="135" y1="545" x2="365" y2="545" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="365,545 357,541 357,549" fill="#0d9488"/>
<line x1="365" y1="545" x2="595" y2="545" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="595,545 587,541 587,549" fill="#0d9488"/>
<line x1="595" y1="545" x2="825" y2="545" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
<polygon points="825,545 817,541 817,549" fill="#0d9488"/>
<circle r="6" fill="#ff9900"><animateMotion dur="6s" repeatCount="indefinite" path="M135,435 L365,435 L595,435 L825,435 L135,545 L365,545 L595,545 L825,545"/></circle>
</svg>